name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Apply D1 migrations
        working-directory: apps/api
        run: |
          npx wrangler d1 migrations apply promptgate --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: apps/api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker secrets
        working-directory: apps/api
        run: |
          echo "${{ secrets.GEMINI_API_KEY }}" | npx wrangler secret put GEMINI_API_KEY
          echo "${{ secrets.GH_OAUTH_CLIENT_SECRET }}" | npx wrangler secret put GITHUB_OAUTH_CLIENT_SECRET
          echo "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Dashboard to Pages
        working-directory: apps/dashboard
        run: |
          npx wrangler pages deploy dist --project-name=promptgate-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test API
        run: |
          response=$(curl -s https://promptgate-api.ekansh-gupta.workers.dev/health)
          echo "$response" | grep -q "healthy" || (echo "API health check failed" && exit 1)
          echo "✓ API is healthy"

      - name: Smoke test Dashboard
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://promptgate-dashboard.pages.dev)
          if [ "$status" -eq 200 ]; then
            echo "✓ Dashboard is accessible"
          else
            echo "Dashboard returned status $status"
            exit 1
          fi
