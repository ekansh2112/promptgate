- name: "Simple feature addition"
  inputs:
    pr_title: "Add user profile page"
    diff: |
      + function UserProfile({ userId }) {
      +   const user = fetchUser(userId);
      +   return <div>{user.name}</div>;
      + }
  assertions:
    - type: contains
      value: "profile"
    - type: length_min
      value: 20
    - type: length_max
      value: 500

- name: "Breaking change"
  inputs:
    pr_title: "BREAKING: Change API response format"
    diff: |
      - return { data: result };
      + return { payload: result, version: 2 };
  critical: true
  assertions:
    - type: contains
      value: "break"
